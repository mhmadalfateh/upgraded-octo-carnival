name: Build Mini Battle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: |
          npm install -g @capacitor/cli

      - name: Prepare Web App
        run: |
          mkdir www
          cp -r ./* www/ || true
          cd www
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "Mini Battle" "com.minibattle.game" --web-dir www
          mkdir -p android
          npx cap add android
          npx cap copy

      - name: Build APK
        run: |
          cd www/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Battle-APK
          path: www/android/app/build/outputs/apk/debug/app-debug.apk
