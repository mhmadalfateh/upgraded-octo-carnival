name: Build Mini Battle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync
          npm install -g @capacitor/cli


      - name: Extract game
        run: |
          mkdir game

          unzip -o *.zip -d game

          echo "Files:"
          find game -maxdepth 3 -type f | head -50


      - name: Find index.html
        run: |
          INDEX=$(find game -name index.html | head -1)

          if [ -z "$INDEX" ]; then
            echo "index.html not found"
            exit 1
          fi

          DIR=$(dirname "$INDEX")

          echo "WEB_DIR=$DIR" >> $GITHUB_ENV


      - name: Create Android project
        run: |
          mkdir app

          rsync -av "$WEB_DIR"/ app/

          cd app

          npm init -y

          npm install @capacitor/core @capacitor/android

          npx cap init \
          "Mini Battle" \
          "com.minibattle.game" \
          --web-dir .

          npx cap add android

          npx cap copy


      - name: Build APK
        run: |
          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Battle-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
